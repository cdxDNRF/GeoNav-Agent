  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });

      /* ---------- deterministic DOM: 25 grid cells + 10 budget cells ---------- */
      var grid = document.querySelector("#t2-gridCells");
      var cells = [];
      for (var r = 0; r < 5; r++) {
        for (var c = 0; c < 5; c++) {
          var cell = document.createElement("div");
          cell.className = "t2-cell";
          cell.style.left = c * 106 + "px";
          cell.style.top = r * 106 + "px";
          var fill = document.createElement("div");
          fill.className = "t2-cellfill";
          cell.appendChild(fill);
          grid.appendChild(cell);
          cells.push(cell);
        }
      }
      var budWrap = document.querySelector("#t2-budcells");
      var buds = [];
      for (var b = 0; b < 10; b++) {
        var bud = document.createElement("div");
        bud.className = "t2-bud";
        bud.style.left = b * 106 + "px";
        var bfill = document.createElement("div");
        bfill.className = "t2-budfill";
        bud.appendChild(bfill);
        if (b === 9) {
          var spent = document.createElement("div");
          spent.className = "t2-budspent";
          bud.appendChild(spent);
        }
        budWrap.appendChild(bud);
        buds.push(bud);
      }

      /* ---------- continuous camera micro-drift (single writer, seek-safe) ---------- */
      var camera = document.querySelector("#t2-camera");
      var drift = { p: 0 };
      var writeCamera = function () {
        var dx = Math.sin(drift.p) * 3;
        var dy = Math.sin(drift.p * 1.3) * 2.5;
        camera.style.transform = "translate(" + dx + "px," + dy + "px)";
      };
      tl.to(drift, { p: Math.PI * 2 * 1.25, duration: 27.562, ease: "none", onUpdate: writeCamera }, 0);
      writeCamera(); /* seed frame 0 */

      /* ---------- topbar ---------- */
      tl.fromTo("#t2-title", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.12);
      tl.fromTo("#t2-kicker", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.26);
      tl.fromTo("#t2-fig", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.38);
      tl.fromTo("#t2-toprule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out", transformOrigin: "left center" }, 0.32);

      /* ============================================================
         Scene 1 (0.0-5.1s) — 5x5 grid stagger self-assembly, centered.
         25 cells > 8, so per the blueprint merge note each cell takes the
         short-path slide form: fades + slides a short distance directly
         into its own slot (no center burst), diagonal cascade wave.
         ============================================================ */
      cells.forEach(function (cell, i) {
        var cr = Math.floor(i / 5), cc = i % 5;
        var at = 0.35 + (cr + cc) * 0.085 + cc * 0.012;
        tl.fromTo(cell, { opacity: 0, scale: 0.7, y: 16 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out" }, at);
      });
      /* 3 visited cells mark ink-faint (route history behind the agent) */
      [5, 6, 11].forEach(function (idx, k) {
        tl.fromTo(cells[idx].firstChild, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 2.3 + k * 0.16);
      });
      /* agent dot enters from the top-left corner */
      tl.fromTo("#t2-dot", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, 3.15);
      tl.fromTo("#t2-dotlabel", { opacity: 0, x: -8 }, { opacity: 0.9, x: 0, duration: 0.5, ease: "power2.out" }, 3.4);
      tl.fromTo("#t2-gridTag", { opacity: 0, y: -8 }, { opacity: 0.85, y: 0, duration: 0.5, ease: "power2.out" }, 4.2);

      /* ============================================================
         Scene 2 (5.1-11.5s) — asymmetric 60/40: grid shrinks left,
         goal / current cards face each other, dashed connector.
         ============================================================ */
      tl.fromTo("#t2-gridWrap", { x: 563, y: 10, scale: 1.15 }, { x: 0, y: 0, scale: 1, duration: 1.3, ease: "power3.inOut" }, 5.15);
      tl.fromTo("#t2-gridFrame", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power1.out" }, 0.15);

      tl.fromTo("#t2-inputtag", { opacity: 0, y: -8 }, { opacity: 0.85, y: 0, duration: 0.5, ease: "power2.out" }, 6.2);

      /* goal card */
      tl.fromTo("#t2-cardG", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 6.55);
      tl.fromTo(["#t2-cardGtag", "#t2-cardGsq"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 6.85);
      tl.fromTo("#t2-cardGzh", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 6.95);
      tl.fromTo("#t2-cardGsub", { opacity: 0, y: 8 }, { opacity: 0.75, y: 0, duration: 0.45, ease: "power2.out" }, 7.1);
      tl.fromTo("#t2-texA", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.85, ease: "power3.out" }, 7.25);
      tl.fromTo("#t2-cardGfoot", { opacity: 0 }, { opacity: 0.75, duration: 0.45, ease: "power1.out" }, 8.1);

      /* current card */
      tl.fromTo("#t2-cardC", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 8.65);
      tl.fromTo(["#t2-cardCtag", "#t2-cardCsq"], { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 8.95);
      tl.fromTo("#t2-cardCzh", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 9.05);
      tl.fromTo("#t2-cardCsub", { opacity: 0, y: 8 }, { opacity: 0.75, y: 0, duration: 0.45, ease: "power2.out" }, 9.2);
      tl.fromTo("#t2-texB", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 0.85, ease: "power3.out" }, 9.35);
      tl.fromTo("#t2-cardCfoot", { opacity: 0 }, { opacity: 0.75, duration: 0.45, ease: "power1.out" }, 10.2);

      /* dashed connector between the two cards */
      tl.fromTo("#t2-conn", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power2.out", transformOrigin: "left center" }, 9.9);
      tl.fromTo("#t2-connsqL", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, 10.25);
      tl.fromTo("#t2-connsqR", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, 10.35);

      /* ============================================================
         Scene 3 (11.5-19.8s) — bottom strip: 4 keys pop one by one,
         10 budget segments light up, out-of-bounds bounce demo costs
         one segment (detail as rule), GOAL cell marked.
         ============================================================ */
      tl.fromTo("#t2-strip", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 11.75);

      var keys = ["#t2-keyU", "#t2-keyD", "#t2-keyL", "#t2-keyR"];
      keys.forEach(function (k, i) {
        tl.fromTo(k, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, 12.15 + i * 0.32);
      });

      tl.fromTo("#t2-kdiv", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "center top" }, 13.5);
      tl.fromTo("#t2-budlabel", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 13.7);
      tl.fromTo("#t2-budcount", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 13.85);
      buds.forEach(function (bud, i) {
        tl.fromTo(bud.firstChild, { scaleX: 0 }, { scaleX: 1, duration: 0.28, ease: "power2.out" }, 13.95 + i * 0.14);
      });

      /* out-of-bounds demo: dot pushes up, hits the border, springs back;
         the step is still spent — one segment extinguishes, counter drops */
      tl.to("#t2-dot", { y: -58, duration: 0.32, ease: "power2.out" }, 15.75);
      tl.fromTo("#t2-edgeflash", { opacity: 0 }, { opacity: 0.85, duration: 0.08, ease: "none" }, 16.05);
      tl.to("#t2-edgeflash", { opacity: 0, duration: 0.4, ease: "power2.out" }, 16.2);
      tl.to("#t2-dot", { y: 0, duration: 0.55, ease: "back.out(2.4)" }, 16.07);
      tl.to(buds[9].querySelector(".t2-budfill"), { opacity: 0.12, duration: 0.3, ease: "power2.out" }, 16.12);
      tl.fromTo(buds[9].querySelector(".t2-budspent"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 16.12);
      tl.fromTo("#t2-minus1", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)", transformOrigin: "50% 50%" }, 16.2);
      tl.to("#t2-count10", { opacity: 0, y: -8, duration: 0.3, ease: "power2.in" }, 16.12);
      tl.fromTo("#t2-count9", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 16.18);

      /* goal cell marked on the grid */
      tl.fromTo("#t2-goalmark", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, 17.9);

      /* ============================================================
         Scene 4 (19.8-27.562s) — "评测端" stamp lands top-right with a
         press-release spring (linear press-in, spring settle, square
         burst ring at release); oracle rows masked; highlight chip;
         whole frame holds.
         ============================================================ */
      /* press: descends and compresses (linear-in, state continuity into release) */
      tl.fromTo("#t2-stamp", { scale: 2.15, opacity: 0, rotation: -13 }, { scale: 0.92, opacity: 1, rotation: -4, duration: 0.5, ease: "power1.in", transformOrigin: "50% 50%" }, 19.95);
      /* release: spring back to rest, adjacent position (tilt kept shallow so
         rotated text line-boxes stay clear of each other and of the card text) */
      tl.to("#t2-stamp", { scale: 1, rotation: -3, duration: 0.6, ease: "back.out(1.8)" }, 20.45);
      /* square burst ring expands behind the stamp at release */
      tl.fromTo("#t2-burst", { scale: 0.6, opacity: 0.6 }, { scale: 3.4, opacity: 0, duration: 0.75, ease: "power2.out", transformOrigin: "50% 50%" }, 20.45);

      tl.fromTo("#t2-stag", { opacity: 0, y: 8 }, { opacity: 0.85, y: 0, duration: 0.45, ease: "power2.out" }, 20.85);
      tl.fromTo("#t2-stsq", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)", transformOrigin: "50% 50%" }, 20.9);
      tl.fromTo("#t2-stzh", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 20.95);

      /* row 1 — 目标坐标: label in, redaction mask wipes over the value slot */
      tl.fromTo("#t2-srowAzh", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 21.4);
      tl.fromTo("#t2-srowAsub", { opacity: 0 }, { opacity: 0.7, duration: 0.4, ease: "power1.out" }, 21.55);
      tl.fromTo("#t2-slotA", { opacity: 0 }, { opacity: 0.45, duration: 0.4, ease: "power1.out" }, 21.6);
      tl.fromTo("#t2-maskA", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 21.9);
      /* row 2 — 真实距离 */
      tl.fromTo("#t2-srowBzh", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 22.45);
      tl.fromTo("#t2-srowBsub", { opacity: 0 }, { opacity: 0.7, duration: 0.4, ease: "power1.out" }, 22.6);
      tl.fromTo("#t2-slotB", { opacity: 0 }, { opacity: 0.45, duration: 0.4, ease: "power1.out" }, 22.65);
      tl.fromTo("#t2-maskB", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 22.95);

      /* highlight chip: the agent can never see this */
      tl.fromTo("#t2-chip", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)", transformOrigin: "0% 50%" }, 24.45);

      /* register (no exits — non-final frame; root transition owns the out) */
      (window.__timelines = window.__timelines || {})["02-task"] = tl;
      tl.seek(0);
    })();
  </script>
