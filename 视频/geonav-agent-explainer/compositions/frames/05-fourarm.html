    });
    /* mono labels land first — bars are still zero-height stubs on the baseline */
    ["fa5-labA", "fa5-labB", "fa5-labC", "fa5-labR", "fa5-labD"].forEach(function (id, i) {
      tl.fromTo("#" + id, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.55 + i * 0.17);
    });

    /* ================= Scene 2 (3.6-16.9) · five bars grow in voice order ================= */
    /* stat-bars-and-fills: scaleY from the baseline; counting-dynamic-scale:
       value + transform scale share the SAME start, duration and ease so they land as one beat */
    function count(numId, target, t, dur, fromScale) {
      var el = document.getElementById(numId);
      var st = { v: 0 };
      tl.to(st, {
        v: target, duration: dur, ease: "power3.out",
        onUpdate: function () { el.textContent = String(Math.round(st.v)); }
      }, t);
      tl.fromTo(el, { scale: fromScale }, { scale: 1, duration: dur, ease: "power3.out" }, t);
    }
    function suffix(id, t) {
      tl.fromTo("#" + id, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(1.8)" }, t);
    }
    function bar(barId, valId, numId, sufId, target, t, dur, fromScale) {
      tl.fromTo("#" + barId, { scaleY: 0 }, { scaleY: 1, duration: dur, ease: "power3.out" }, t);
      tl.fromTo("#" + valId, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, t);
      count(numId, target, t, dur, fromScale);
      suffix(sufId, t + dur);
    }

    bar("fa5-barA", "fa5-valA", "fa5-numA", "fa5-sufA", 5, 4.00, 1.05, 0.55);
    bar("fa5-barB", "fa5-valB", "fa5-numB", "fa5-sufB", 10, 6.10, 1.05, 0.55);
    bar("fa5-barC", "fa5-valC", "fa5-numC", "fa5-sufC", 10, 8.30, 1.05, 0.55);
    bar("fa5-barR", "fa5-valR", "fa5-numR", "fa5-sufR", 5, 10.40, 1.05, 0.55);
    /* D — the hero: longer growth, solid-ink flip + one glow bloom landing together (~14s) */
    bar("fa5-barD", "fa5-valD", "fa5-numD", "fa5-sufD", 50, 12.40, 1.5, 0.5);
    tl.fromTo("#fa5-dfill", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 13.90);

    /* ambient-glow-bloom: hero bloom swells in behind D as it settles, then a bounded breathe */
    var glow = document.getElementById("fa5-glow");
    tl.fromTo(glow,
      { opacity: 0, scale: 0.82 },
      { opacity: 0.34, scale: 1, duration: 1.0, ease: "power2.out" }, 13.40);
    var gp = { p: 0 };
    tl.to(gp, {
      p: Math.PI * 2 * 2.4, duration: 12.4, ease: "none",
      onUpdate: function () {
        var s = Math.sin(gp.p);
        glow.style.opacity = String(0.34 + s * 0.04);
        glow.style.transform = "scale(" + (1 + s * 0.018) + ")";
      }
    }, 14.40);

    /* multi-phase-camera: one writer composes phase scale + sine drift; drift spans the whole shot */
    var cam = document.getElementById("fa5-camera");
    var phase = { scale: 1 };
    tl.to(phase, { scale: 1.035, duration: 2.6, ease: "power2.inOut" }, 13.20);   /* climax push as D lands */
    tl.to(phase, { scale: 0.965, duration: 2.3, ease: "power2.inOut" }, 21.90);   /* the closing pull-back */
    var drift = { p: 0 };
    tl.to(drift, {
      p: Math.PI * 2 * 2, duration: 26.887, ease: "none",
      onUpdate: function () {
        var dx = Math.sin(drift.p) * 5;
        var dy = Math.sin(drift.p * 1.31) * 2;
        cam.style.transform = "scale(" + phase.scale + ") translate(" + dx + "px," + dy + "px)";
      }
    }, 0);

    /* ================= Scene 3 (16.9-21.8) · annotation card beside bar C ================= */
    tl.fromTo("#fa5-card", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.7)" }, 17.30);
    tl.to("#fa5-link", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 17.75);
    tl.fromTo("#fa5-cA", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 17.55);
    tl.fromTo("#fa5-c55", { opacity: 0, y: 20 }, { opacity: 0.62, y: 0, duration: 0.45, ease: "power2.out" }, 17.75);
    tl.fromTo("#fa5-carr", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.35, ease: "power2.inOut" }, 18.05);
    tl.fromTo("#fa5-c37", { scale: 0.78, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 18.20);
    tl.fromTo("#fa5-cC", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 19.10);
    tl.fromTo("#fa5-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 19.60);

    /* ================= Scene 4 (21.8-26.9) · pull-back + per-word closing line ================= */
    /* kinetic-beat-slam: one onset grid, a distinct entrance axis per word.
       y-offsets capped at 10px: the line sits at 734-763, just above the caption
       card (~770) — deeper dives would cross it or the column labels. */
    var B = [22.30, 22.47, 22.64, 22.81, 22.98, 23.15, 23.32];
    tl.fromTo("#fa5-w1", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, B[0]);
    tl.fromTo("#fa5-w2", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, B[1]);
    tl.fromTo("#fa5-w3",
      { scale: 1.45, filter: "blur(10px)", opacity: 0 },
      { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.5, ease: "power4.out" }, B[2]);
    tl.fromTo("#fa5-w4", { x: -90, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, B[3]);
    tl.fromTo("#fa5-w5", { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "circ.out" }, B[4]);
    tl.fromTo("#fa5-w6", { x: 96, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, B[5]);
    tl.fromTo("#fa5-w7",
      { y: 10, filter: "blur(6px)", opacity: 0 },
      { y: 0, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power4.out" }, B[6]);

    /* hold to end — the pull-back settles, glow breathes, camera drifts on; no exit */
  })();
</script>
</template>
