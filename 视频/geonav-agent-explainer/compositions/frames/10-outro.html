<script>
  (function () {
    var tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["10-outro"] = tl;

    /* ---------- build the 5x5 thumbnail cells (deterministic loop) ---------- */
    var NS = "http://www.w3.org/2000/svg";
    var cellsG = document.getElementById("ou10-cells");
    for (var r = 0; r < 5; r++) {
      for (var c = 0; c < 5; c++) {
        var rc = document.createElementNS(NS, "rect");
        rc.setAttribute("x", String(3 + 90 * c));
        rc.setAttribute("y", String(3 + 90 * r));
        rc.setAttribute("width", "84");
        rc.setAttribute("height", "84");
        rc.setAttribute("class", "ou10-cell");
        cellsG.appendChild(rc);
      }
    }

    /* ---------- replay trace: measure, never guess ---------- */
    var trace = document.getElementById("ou10-trace");
    var TRACE_LEN = (trace.getTotalLength ? trace.getTotalLength() : 540) * 1.02;
    trace.style.strokeDasharray = TRACE_LEN;
    trace.style.strokeDashoffset = TRACE_LEN;

    /* ---------- card chain: hard cuts at full opacity (tl.set, deliberately no transition) ---------- */
    tl.set("#ou10-c1", { opacity: 1 }, 0);
    tl.set("#ou10-c3", { opacity: 0 }, 0);
    tl.set("#ou10-c1", { opacity: 0 }, 7.9);
    tl.set("#ou10-c2", { opacity: 1 }, 7.9);
    tl.set("#ou10-c2", { opacity: 0 }, 13.6);
    tl.set("#ou10-c3", { opacity: 1 }, 13.6);

    /* barely-perceptible continuous slow scale-up across each card hold (chain register) */
    tl.fromTo("#ou10-c1", { scale: 1 }, { scale: 1.012, duration: 7.6, ease: "none", transformOrigin: "960px 500px" }, 0.3);
    tl.fromTo("#ou10-c2", { scale: 1 }, { scale: 1.01, duration: 5.6, ease: "none", transformOrigin: "960px 500px" }, 8.0);
    tl.fromTo("#ou10-c3", { scale: 1 }, { scale: 1.008, duration: 7.56, ease: "none", transformOrigin: "960px 500px" }, 13.7);

    /* ================= Card 1 (0.0-7.9) · 台账 ================= */

    /* header chrome */
    tl.fromTo("#ou10-kick1", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.1);
    tl.fromTo("#ou10-meta1", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.24);
    tl.fromTo("#ou10-lrule", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.inOut" }, 0.38);

    /* 5x5 grid cascades in while the voice establishes the ledger */
    tl.fromTo("#ou10-cells rect", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out", stagger: 0.028 }, 0.55);
    tl.fromTo("#ou10-sdot", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.5);
    tl.fromTo("#ou10-vis0", { opacity: 0 }, { opacity: 0.42, duration: 0.3, ease: "power1.out" }, 1.55);
    tl.fromTo("#ou10-glabel", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.75);

    /* ledger line 1 — 每个批次可重放审计 (VO ~3.1-5.1) */
    tl.fromTo("#ou10-row1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 3.2);

    /* replay trace self-draws across the grid (VO 每个批次可重放审计); visited cells fill as it passes */
    tl.to("#ou10-trace", { strokeDashoffset: 0, duration: 2.2, ease: "none" }, 3.2);
    var visTimes = [3.57, 3.93, 4.3, 4.67, 5.03];
    for (var k = 1; k <= 5; k++) {
      tl.fromTo("#ou10-vis" + k, { opacity: 0 }, { opacity: 0.42, duration: 0.25, ease: "power1.out" }, visTimes[k - 1]);
    }
    /* goal cell lands solid as the trace arrives */
    tl.fromTo("#ou10-vis6", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 5.42);
    tl.fromTo("#ou10-gdot", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 5.5);

    /* divider + ledger line 2 — 失败与负结果全部保留 (VO ~5.2-7.6) */
    tl.fromTo("#ou10-cdiv", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 4.45);
    tl.fromTo("#ou10-row2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 5.25);

    /* ================= Card 2 (7.9-13.6) · 下一步路线 (hard cut at 7.9) ================= */

    tl.fromTo("#ou10-kick2", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 8.0);
    tl.fromTo("#ou10-meta2", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 8.15);
    tl.fromTo("#ou10-rhead", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.inOut" }, 8.3);

    /* three numbered routes, per-word entrances paced to the voice */
    function word(sel, t) {
      tl.fromTo(sel, { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, t);
    }
    /* 01 独立源图确认 S3 (VO 独立源图确认 ~8.8-10.15) */
    word("#ou10-n1", 8.9);
    word("#ou10-w11", 9.1);
    word("#ou10-w12", 9.45);
    word("#ou10-w13", 9.85);
    word("#ou10-chip1", 10.0);
    tl.fromTo("#ou10-fdiv1", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, 10.45);
    /* 02 测试集终评 (VO ~10.15-11.35) */
    word("#ou10-n2", 10.35);
